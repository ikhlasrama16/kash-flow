name: CI/CD

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: self-hosted

    steps:
      - name: Pull Latest Code & Rebuild Docker
        run: |
          cd /opt/kash-flow
          git pull origin main
          cd /opt/finance-backend
          docker compose build finance-web --no-cache
          docker compose up -d finance-web